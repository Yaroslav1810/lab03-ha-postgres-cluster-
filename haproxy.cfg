# Общие настройки
defaults
    mode tcp
    timeout connect 4s
    timeout client 30m
    timeout server 30m

# настройки страницы статистики
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

# Приём подключений к PostgreSQL
listen postgres
    bind *:5432

    # Проверяем роль через API Patroni
    option httpchk GET /primary
    http-check expect status 200

    # Адреса PostgreSQL — порт 5432, проверка API Patroni — порт 8008
    server postgresql0 pg-master:5432 check port 8008
    server postgresql1 pg-slave:5432 check port 8008
